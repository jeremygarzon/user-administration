server:
  port: 8080
spring:
  application:
    name: "UserAdministration"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      timeout: "500ms"
      connect-timeout: "500ms"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapter:
  restconsumer:
    timeout: 5000
    url: "https://reqres.in"
    api-key: "${REQRES_API_KEY}"
  sqs:
    region: "${AWS_REGION:us-east-1}"
    queueUrl: "${USER_EVENTS_QUEUE_URL:http://localhost:4566/000000000000/user-created-events}"
    endpoint: "${AWS_ENDPOINT:http://localhost:4566}"
adapters:
  r2dbc:
    host: "${DB_HOST:localhost}"
    port: "${DB_PORT:5432}"
    database: "${DB_NAME:user_administration}"
    schema: "${DB_SCHEMA:public}"
    username: "${DB_USER:postgres}"
    password: "${DB_PASSWORD:postgres}"
  redis:
    user-ttl: "${USER_CACHE_TTL:10m}"
resilience4j:
  circuitbreaker:
    instances:
      reqres:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
entrypoint:
  sqs:
    region: "${AWS_REGION:us-east-1}"
    endpoint: "${AWS_ENDPOINT:http://localhost:4566}"
    queueUrl: "${USER_EVENTS_QUEUE_URL:http://localhost:4566/000000000000/user-created-events}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
aws:
  region: "${AWS_REGION:us-east-1}"
  dynamodb:
    endpoint: "${AWS_ENDPOINT:http://localhost:4566}"
    users-table: "${DYNAMODB_USERS_TABLE:users}"
